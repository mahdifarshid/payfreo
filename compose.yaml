services:
  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: file:/data/payfreo.sqlite
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - core-data:/data
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 :
          1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  core-data:
